[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-agents"
version = "0.1.0"
description = "An open, governance-first structured-finance agent framework: fixed, tested primitives orchestrated by a dynamic LLM planner, with citations, confidence, and an append-only audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hypoport" }]
keywords = ["structured-finance", "rmbs", "agents", "bedrock", "governance", "esma"]
dependencies = [
    "boto3>=1.34",
    "pypdf>=4.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "tavily-python>=0.3",
]

[project.urls]
Homepage = "https://github.com/hypoport/sf-agents"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
